<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>اسلامی اقوال</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: #17352f;
    background:
        radial-gradient(circle at top right, rgba(255,255,255,.9), transparent 35%),
        linear-gradient(135deg, #b7e4d5, #eefbf5, #a9d8c8);
    transition: background .4s, color .4s;
}

/* Header */
header {
    padding: 25px 15px;
    text-align: center;
    color: white;
    background: linear-gradient(135deg, #075e54, #128c7e);
    box-shadow: 0 4px 15px rgba(0,0,0,.2);
}

header h1 {
    margin: 0 0 15px;
    font-size: 32px;
}

nav button {
    border: none;
    border-radius: 25px;
    padding: 10px 17px;
    margin: 4px;
    cursor: pointer;
    color: #075e54;
    background: white;
    font-size: 14px;
    transition: .3s;
}

nav button:hover,
.action-buttons button:hover,
.search-box button:hover,
.categories button:hover {
    transform: translateY(-3px);
}

/* Main */
.container {
    width: 92%;
    max-width: 720px;
    margin: 35px auto;
}

/* Card */
.card,
.about {
    background: rgba(255,255,255,.94);
    border-radius: 25px;
    padding: 30px 22px;
    text-align: center;
    box-shadow: 0 12px 35px rgba(0,0,0,.15);
    animation: fadeIn .7s ease;
}

.card h2,
.about h2 {
    color: #075e54;
    margin-top: 0;
}

.subtitle {
    font-size: 16px;
    margin-bottom: 25px;
}

/* Search */
.search-box {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
}

.search-box input {
    flex: 1;
    padding: 13px;
    border: 1px solid #c8d8d3;
    border-radius: 12px;
    outline: none;
    font-size: 16px;
}

.search-box button {
    background: #075e54;
    color: white;
}

/* Categories */
.categories {
    margin: 15px 0;
}

.categories button {
    border: none;
    border-radius: 20px;
    padding: 9px 15px;
    margin: 4px;
    background: #dff4ed;
    color: #075e54;
    cursor: pointer;
    transition: .3s;
}

/* Quote */
.quote {
    margin: 28px 5px;
    padding: 25px 15px;
    border-right: 5px solid #128c7e;
    border-left: 5px solid #128c7e;
    border-radius: 15px;
    background: #f2fbf7;
    font-size: 24px;
    line-height: 2;
    font-weight: bold;
    animation: quoteAnimation .6s ease;
}

/* Buttons */
.action-buttons button {
    border: none;
    border-radius: 25px;
    padding: 11px 16px;
    margin: 5px;
    cursor: pointer;
    color: white;
    background: #075e54;
    transition: .3s;
}

/* About */
.about {
    display: none;
    line-height: 2;
}

/* Dark Mode */
body.dark {
    color: #eee;
    background:
        radial-gradient(circle at top right, #24443e, transparent 40%),
        linear-gradient(135deg, #071c18, #102b26, #061410);
}

body.dark .card,
body.dark .about {
    background: rgba(25,35,33,.96);
    color: #eee;
}

body.dark .card h2,
body.dark .about h2 {
    color: #8ee5d2;
}

body.dark .quote {
    background: #162b27;
    color: #fff;
}

body.dark .categories button {
    background: #25443e;
    color: #a9eee0;
}

body.dark .search-box input {
    background: #172521;
    color: white;
    border-color: #46645e;
}

/* Animations */
@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes quoteAnimation {
    from {
        opacity: 0;
        transform: scale(.96);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

/* Mobile */
@media (max-width: 600px) {

    header h1 {
        font-size: 26px;
    }

    .container {
        width: 94%;
        margin: 20px auto;
    }

    .card,
    .about {
        padding: 23px 15px;
    }

    .search-box {
        flex-direction: column;
    }

    .quote {
        font-size: 20px;
    }

    .action-buttons button {
